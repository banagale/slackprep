[project]
name = "slackprep"
version = "0.3.0"
description = "Convert bounded Slackdump 4 exports to Markdown or JSONL for LLM context"
authors = [{ name = "Rob Banagale" }]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/banagale/slackprep"
Repository = "https://github.com/banagale/slackprep"
Issues = "https://github.com/banagale/slackprep/issues"

[project.scripts]
slackprep = "slackprep.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "slackprep", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = "^0.16.2"
pytest = "^9.1.1"
pre-commit = "^4.6.2"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "node_modules",
    "build",
    "dist",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: opt-in tests against a private local Slack export",
]
